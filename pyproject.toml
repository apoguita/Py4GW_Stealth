[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "py4gw-stealth"
version = "0.1.0"
description = "Read-only Windows process and memory scanning for Guild Wars research"
requires-python = ">=3.11"
dependencies = [
    "nicegui[native]",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["py4gw*"]
